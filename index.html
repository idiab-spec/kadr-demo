<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kadr car photo guide</title>
<meta name="description" content="A live camera guide that helps people take good photos of their car for an insurance claim.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 1. Start -->
<section id="screen-start" class="page start">
  <div class="page-top"><button class="text-btn js-lang" type="button">العربية</button></div>
  <div class="start-main">
    <div class="app-icon" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none">
        <path d="M10 20v-6a4 4 0 0 1 4-4h6M44 10h6a4 4 0 0 1 4 4v6M54 44v6a4 4 0 0 1-4 4h-6M20 54h-6a4 4 0 0 1-4-4v-6" stroke="#FFD60A" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M17 39.5v-5.2c0-1.4.9-2.6 2.2-3l3.6-1.1 3.8-4.6a4 4 0 0 1 3.1-1.5h7.2a4 4 0 0 1 2.9 1.2l4.4 4.6 3.6 1a3 3 0 0 1 2.2 2.9v5.7a1.5 1.5 0 0 1-1.5 1.5H18.5a1.5 1.5 0 0 1-1.5-1.5z" fill="#fff"/>
        <circle cx="24.5" cy="41" r="4.2" fill="#1c1c1e" stroke="#fff" stroke-width="2"/>
        <circle cx="40.5" cy="41" r="4.2" fill="#1c1c1e" stroke="#fff" stroke-width="2"/>
      </svg>
    </div>
    <h1 data-i18n="startTitle"></h1>
    <p class="subtitle" data-i18n="startLede"></p>
    <ul class="features">
      <li>
        <span class="f-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 21.5s-6.5-6-6.5-11.2a6.5 6.5 0 0 1 13 0C18.5 15.5 12 21.5 12 21.5z"/><circle cx="12" cy="10.3" r="2.4"/></svg></span>
        <div><h3 data-i18n="f1Title"></h3><p data-i18n="f1Text"></p></div>
      </li>
      <li>
        <span class="f-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4.5 4.5h15a1.5 1.5 0 0 1 1.5 1.5v9.5a1.5 1.5 0 0 1-1.5 1.5H10l-4.5 3.5V17h-1A1.5 1.5 0 0 1 3 15.5V6a1.5 1.5 0 0 1 1.5-1.5z"/><path d="M7.5 9h9M7.5 12.5h6" stroke-linecap="round"/></svg></span>
        <div><h3 data-i18n="f2Title"></h3><p data-i18n="f2Text"></p></div>
      </li>
      <li>
        <span class="f-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3.5 8.5a2 2 0 0 1 2-2h2.2l1.4-2h5.8l1.4 2h2.2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.4"/></svg></span>
        <div><h3 data-i18n="f3Title"></h3><p data-i18n="f3Text"></p></div>
      </li>
    </ul>
  </div>
  <div class="start-bottom">
    <p class="status" id="start-status" role="status"></p>
    <button id="btn-start" class="btn-primary" type="button" data-i18n="start"></button>
    <label class="text-btn" for="video-file" data-i18n="useVideo"></label>
    <input id="video-file" type="file" accept="video/*" hidden>
    <p class="footnote" data-i18n="privacy"></p>
  </div>
</section>

<!-- 2. Camera -->
<section id="screen-capture" class="capture" hidden>
  <div class="stage" id="stage">
    <video id="cam" playsinline muted autoplay></video>
    <img id="test-img" class="src" alt="" crossorigin="anonymous" hidden>
    <canvas id="overlay"></canvas>
    <div class="flash" id="flash"></div>

    <header class="cam-top">
      <button class="round-btn" id="btn-close" type="button" data-i18n-label="close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
      </button>
      <button class="title-pill" id="btn-shotlist" type="button">
        <span class="shot-name" id="shot-name"></span>
        <span class="shot-count" id="shot-count"></span>
      </button>
      <div class="cam-top-end">
        <button class="round-btn" id="btn-aiview" type="button" aria-pressed="false" data-i18n-label="aiView">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8.5V6.5A2.5 2.5 0 0 1 6.5 4h2M15.5 4h2A2.5 2.5 0 0 1 20 6.5v2M20 15.5v2a2.5 2.5 0 0 1-2.5 2.5h-2M8.5 20h-2A2.5 2.5 0 0 1 4 17.5v-2"/><circle cx="12" cy="12" r="2.6"/></svg>
        </button>
        <button class="round-btn" id="btn-voice" type="button" aria-pressed="true" data-i18n-label="sound">
          <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>
          <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
        </button>
      </div>
    </header>
    <p class="shot-tip" id="shot-tip"></p>

    <div class="ai-panel" id="ai-panel" hidden>
      <ul class="checks" id="checks"></ul>
      <div class="hud" id="hud"></div>
    </div>
    <p class="hint" id="hint" hidden></p>
    <div class="instruction" id="instruction" data-state="search" role="status" aria-live="polite"><span id="instruction-text"></span></div>
  </div>

  <div class="controls">
    <div class="control-row">
      <div class="map-slot"><svg class="map mini-map" id="mini-map" viewBox="0 0 160 200" aria-hidden="true"></svg></div>
      <button class="shutter" id="btn-shutter" type="button" data-i18n-label="takePhoto">
        <svg viewBox="0 0 80 80" aria-hidden="true"><circle class="ring-bg" cx="40" cy="40" r="36"/><circle class="ring" id="ring" cx="40" cy="40" r="36"/></svg>
        <span class="core"></span>
      </button>
      <button class="thumb-btn" id="btn-thumb" type="button" data-i18n-label="allPhotos"><img id="last-thumb" alt="" hidden></button>
    </div>
    <div class="control-links">
      <button class="text-btn" id="btn-skip" type="button" data-i18n="skip"></button>
      <button class="text-btn" id="btn-torch" type="button" aria-pressed="false" hidden data-i18n="torch"></button>
      <button class="text-btn accent" id="btn-anyway" type="button" hidden data-i18n="takeAnyway"></button>
    </div>
  </div>

  <div class="review" id="review" hidden>
    <img id="review-img" alt="">
    <div class="review-bar">
      <span class="review-count" id="review-count"></span>
      <button class="text-btn" id="btn-retake" type="button" data-i18n="retake"></button>
      <div class="review-status">
        <p class="review-title" id="review-title"></p>
        <p class="review-meta" id="review-meta"></p>
      </div>
      <button class="text-btn strong" id="btn-next" type="button"></button>
    </div>
  </div>

  <div class="sheet" id="shot-sheet" hidden>
    <div class="sheet-inner">
      <span class="grabber" aria-hidden="true"></span>
      <div class="sheet-head">
        <h2 data-i18n="allPhotos"></h2>
        <button class="text-btn strong" id="btn-sheet-close" type="button" data-i18n="doneBtn"></button>
      </div>
      <ol class="sheet-list" id="sheet-list"></ol>
    </div>
  </div>
</section>

<!-- 3. Done -->
<section id="screen-done" class="page done" hidden>
  <div class="page-top"><button class="text-btn js-lang" type="button">العربية</button></div>
  <div class="done-hero">
    <span class="done-icon" id="done-icon" aria-hidden="true"></span>
    <h1 id="done-title"></h1>
    <p class="subtitle" id="done-sub"></p>
  </div>
  <h2 class="section-label" data-i18n="receives"></h2>
  <ul class="group" id="report-list"></ul>
  <p class="footnote group-foot" data-i18n="tapToRetake"></p>
  <div class="done-bottom">
    <button class="btn-primary" id="btn-send" type="button" data-i18n="send"></button>
    <button class="text-btn" id="btn-again" type="button" data-i18n="again"></button>
  </div>
  <p class="toast" id="toast" role="status" hidden></p>
</section>

<script type="module" src="js/app.js"></script>
</body>
</html>
